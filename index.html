<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Sorting</title>
</head>
<body>
    
    <div id="inputs">
    <label for="select-algorithm"> Select Algorithm
    <select id="select-algorithm">
        <option value="">Select Algorithm</option>
        <option value="BubbleSort">Bubble Sort</option>
        <option value="MergeSort">Merge Sort</option>
        <option value="QuickSort">Quick Sort</option>
    </select>
    </label>
    <label for="slider"> Size
        <input id="slider" name="slider" type="range" min="10" max="300" value="100">
    </label>
    <button id="execute">Execute</button>
    <button id="rand">Shuffel</button>
    <!-- <button id="halt">Halt</button> -->
    <label id="timer-label">Time Taken: <span id="timer">--</span></label>
    </div>

    <canvas id="canvas"></canvas>
    <script src="./index.js"></script>
</body>
</html>
